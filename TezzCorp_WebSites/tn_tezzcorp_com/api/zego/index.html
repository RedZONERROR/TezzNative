<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Call</title>
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
        window.onload = async function () {
            try {
                function getUrlParams(url) {
                    let urlStr = url.split('?')[1];
                    const urlSearchParams = new URLSearchParams(urlStr);
                    return Object.fromEntries(urlSearchParams.entries());
                }

                const roomID = getUrlParams(window.location.href)['roomID'] || (Math.floor(Math.random() * 10000) + "");
                const userID = Math.floor(Math.random() * 10000) + "";
                const userName = "userName" + userID;
                const appID = 1182562126;
                const serverSecret = "1d7ed8721d51b64aca1bd14465173597";

                const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

                const joinLink = `${window.location.protocol}//${window.location.host}/api/zego/?roomID=${encodeURIComponent(roomID)}&userID=${encodeURIComponent(userID)}&userName=${encodeURIComponent(userName)}`;
                console.log('Join link:', joinLink);

                const callResponse = await fetch('https://www.bthdevelopers.com/api/zego/call.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        callId: roomID,
                        caller: userID,
                        recipient: 'android_user',
                        joinLink: joinLink
                    })
                });

                if (!callResponse.ok) {
                    throw new Error(`Call notification failed: ${callResponse.status} ${callResponse.statusText}`);
                }

                console.log('Call notification sent');

                const zp = ZegoUIKitPrebuilt.create(kitToken);
                zp.joinRoom({
                    container: document.querySelector("#root"),
                    sharedLinks: [
                        {
                            name: 'Personal link',
                            url: `${window.location.protocol}//${window.location.host}${window.location.pathname}?roomID=${roomID}`
                        }
                    ],
                    scenario: {
                        mode: ZegoUIKitPrebuilt.VideoConference
                    },
                    turnOnMicrophoneWhenJoining: true,
                    turnOnCameraWhenJoining: true,
                    showMyCameraToggleButton: true,
                    showMyMicrophoneToggleButton: true,
                    showAudioVideoSettingsButton: true,
                    showScreenSharingButton: true,
                    showTextChat: true,
                    showUserList: true,
                    maxUsers: 50,
                    layout: "Sidebar",
                    showLayoutButton: true
                });

            } catch (error) {
                console.error('Error initializing call:', error);
                document.body.innerHTML = `<div style="color: red; padding: 20px;">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
