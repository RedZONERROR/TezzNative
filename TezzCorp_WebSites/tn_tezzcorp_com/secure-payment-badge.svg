<svg width="250" height="70" viewBox="0 0 250 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="animatedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50">
        <animate attributeName="stop-color" values="#4CAF50;#66BB6A;#4CAF50" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#388E3C">
        <animate attributeName="stop-color" values="#388E3C;#81C784;#388E3C" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="250" height="70" rx="15" fill="url(#animatedGradient)" />

  <!-- Check Icon -->
  <g transform="translate(20, 18)">
    <circle cx="17" cy="17" r="17" fill="#ffffff" />
    <path d="M10 17l5 5 10-10" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text -->
  <text x="70" y="43" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="bold">
    Secure Payment
  </text>
</svg>